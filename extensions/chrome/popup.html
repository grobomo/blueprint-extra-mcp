<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blueprint MCP</title>
  <link rel="stylesheet" href="../shared/popup/popup.css">
  <style>
    /* V1 Helper section */
    .v1-section {
      padding: 12px 16px;
      margin-top: 8px;
      background: #fef2f2;
      border-radius: 8px;
      border: 1px solid #fde8e8;
    }
    .v1-section h3 {
      font-size: 12px;
      font-weight: 600;
      color: #D71920;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
    }
    .v1-stat {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      font-size: 13px;
    }
    .v1-stat-label { color: #666; }
    .v1-stat-value { font-weight: 600; }
    .v1-import-btn {
      padding: 6px 8px;
      background: #D71920;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .v1-import-btn:hover { opacity: 0.9; }
    .v1-import-btn:disabled { opacity: 0.5; cursor: default; }
    .cve-row {
      padding: 6px 8px;
      border-bottom: 1px solid #f3f4f6;
    }
    .cve-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../shared/popup/popup.js"></script>
</body>
</html>
